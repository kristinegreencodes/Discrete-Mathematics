plugins { id 'com.android.application' }

android {
    namespace 'com.kristinegreen.discretemath'
    compileSdk 35
    defaultConfig {
        applicationId "com.kristinegreen.discretemath"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            storeFile file("keystore/discrete.jks")
            storePassword "discretemath"
            keyAlias "discrete"
            keyPassword "discretemath"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
